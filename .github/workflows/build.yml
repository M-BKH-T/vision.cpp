name: Build Linux x86_64 for Colab

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Force Update Submodules
        run: |
          git submodule update --init --recursive --force

      - name: Build vision.cpp with CMake
        run: |
          mkdir build_linux
          cd build_linux
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DVISP_FMT_LIB=ON \
            -DVISP_CI=ON \
            -DVISP_PACKAGE=ON
          make -j$(nproc)

      - name: Upload Binaries and Shared Libraries
        uses: actions/upload-artifact@v4
        with:
          name: vision-cpp-linux-x86_64
          path: |
            build_linux/bin/vision-cli
            build_linux/lib/*.so*
            build_linux/**/*.so*
