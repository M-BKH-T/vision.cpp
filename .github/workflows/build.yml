name: Build Android ARM64 Libraries

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Force Update Submodules
        run: |
          git submodule update --init --recursive --force

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8512546

      - name: Install NDK Package
        run: |
          yes | sdkmanager "ndk;26.1.10909125"

      - name: Build vision.cpp for Android ARM64
        run: |
          NDK_PATH=$ANDROID_HOME/ndk/26.1.10909125
          mkdir build_android_arm64
          cd build_android_arm64
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DVISP_FMT_LIB=ON \
            -DVISP_CI=ON \
            -DVISP_PACKAGE=ON \
            -DVISP_TESTS=OFF
          make -j$(nproc)

      - name: Upload Android Shared Libraries
        uses: actions/upload-artifact@v4
        with:
          name: vision-cpp-android-arm64
          path: |
            build_android_arm64/bin/vision-cli
            build_android_arm64/lib/*.so*
            build_android_arm64/**/*.so*
