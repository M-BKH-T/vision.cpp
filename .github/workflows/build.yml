name: Build Android ARM64

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Force Update Submodules
        run: |
          git submodule update --init --recursive --force

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8512546

      - name: Install NDK Package
        run: |
          yes | sdkmanager "ndk;26.1.10909125"

      - name: Build vision.cpp with CMake
        run: |
          NDK_PATH=$ANDROID_HOME/ndk/26.1.10909125
          mkdir build_android
          cd build_android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DVISP_FMT_LIB=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON
          make -j$(nproc)

      - name: Upload Binaries and Shared Libraries
        uses: actions/upload-artifact@v4
        with:
          name: vision-cpp-android-arm64
          path: |
            build_android/**/*.so
            build_android/**/vision-cli
